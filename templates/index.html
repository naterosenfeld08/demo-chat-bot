<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo chat bot</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #6b645b;
      --card: #fffdf8;
      --line: #e4ddd2;
      --accent: #0f6e56;
      --user: #e7f3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 16px;
    }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 600; }
    p { margin: 6px 0 0; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 0.9rem; }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9rem;
    }
    select, button, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
    }
    select, button { padding: 8px 12px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    #log {
      flex: 1;
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .user { align-self: flex-end; background: var(--user); }
    .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
    .error { align-self: stretch; background: #fdecea; color: #8a1f11; font-family: ui-sans-serif, system-ui, sans-serif; }
    form { display: flex; gap: 8px; }
    textarea { flex: 1; min-height: 52px; resize: vertical; padding: 12px; }
    .banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff4d6;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Demo chat bot</h1>
        <p>Model {{ model }} · TensorX</p>
      </div>
      <div class="controls">
        <label>
          Tone
          <select id="tone">
            <option value="helpful">Helpful</option>
            <option value="tutor">Tutor</option>
            <option value="concise">Concise</option>
          </select>
        </label>
        <button id="clear" type="button">Clear chat</button>
      </div>
    </header>
    {% if not key_ready %}
    <div class="banner">Add your TensorX key to <code>.env</code> as <code>TENSORX_API_KEY</code>, then restart the app.</div>
    {% endif %}
    <div id="log" aria-live="polite"></div>
    <form id="composer">
      <textarea id="message" placeholder="Ask something" required></textarea>
      <button class="primary" type="submit">Send</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("composer");
    const messageBox = document.getElementById("message");
    const tone = document.getElementById("tone");
    const messages = [];

    function addBubble(role, text) {
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = text;
      log.appendChild(el);
      el.scrollIntoView({ block: "end" });
    }

    document.getElementById("clear").addEventListener("click", () => {
      messages.length = 0;
      log.replaceChildren();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = messageBox.value.trim();
      if (!content) return;
      messageBox.value = "";
      messages.push({ role: "user", content });
      addBubble("user", content);
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages, tone: tone.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        messages.push({ role: "assistant", content: data.reply });
        addBubble("assistant", data.reply);
      } catch (error) {
        addBubble("error", error.message);
        messages.pop();
      } finally {
        button.disabled = false;
        messageBox.focus();
      }
    });
  </script>
</body>
</html>
