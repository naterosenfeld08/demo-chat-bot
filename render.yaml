services:
  - type: web
    name: petase-run-analyst
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: LLM_MODE
        value: echo
      - key: PYTHON_VERSION
        value: "3.12.0"
